date: 09/01/2026
description: Day 6 of Tasmanian trip - Stanley to Devonport coastal drive
Stanley was not on our original itinerary, but we covered a lot in Cradle Mountains yesterday and there was no need to come back. This freed up our morning for a visit to Stanley - one lovely coastal town in North-West of Tasmania. Glad we did - it was the highlight of the day, despite the grey skies ( our first rainy day these holidays). 
Driven through some massive fields of opium poppies which are almost white in colour - Google informed us that Tasmania’s opium production industry is massive. 
Also discovered there is Mt Roland in Tasmania 😀😂😀
Stopped very briefly in Burnie for a coffee (fairly unremarkable town) and Pinguin for photos ( this one I actually liked).
We are staying in still very new Novotel in Devonport - it’s fun to see all the boats coming into the hatbour from our hotel balcony. 😊
