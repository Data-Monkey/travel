description: Day 5 of Tasmanian trip - Cradle Mountains
Gorgeous day spent walking in Cradle Mountains, glad we left enough time to enjoy this spectacular area. We were just in time to see the Tasmanian Devils in Devils@Cradle before closure 😊 Then we drove off to our accommodation for the night - very nice little cottage at Arion Park Clydesdale Farmstay. So peaceful and picturesque here amongst the beautiful gardens and horse paddocks - perfect ending to another great day in TAS
