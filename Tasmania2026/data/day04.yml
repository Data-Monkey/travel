date: 07/01/2026
description: Day 4 of Tasmanian trip ( Derwent Bridge to Strahan via Queenstown). We’ve started with a visit to The Wall (private art gallery in Derwent Bridge with increadible timber works by a solo artist). No photos were allowed, but his wood carving skills are quite impressive. Then a drive to the Queenstown ( we only stopped for lunch there), with a short detour to see Nelson Falls and then to Strahan. Took a boat tour in the afternoon which was very enjoyable and informative and arrived back in Strahan just in time for a spectacular sunset.
